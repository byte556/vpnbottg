bot:
  token: "YOUR_BOT_TOKEN"
  admin_id: 0           # твой Telegram user ID
  support: "@example"   # username поддержки
  referral_reward_pct: 50  # % от оплаты реферала → баланс реферрера
  constructor:
    price_base: 149          # ₽/мес за 1 устройство (базовая цена)
    price_per_device: 100    # ₽/мес за каждое дополнительное устройство
    devices_step: 1
    default_devices: 1
    month_discounts:
      1:  1.00
      3:  0.85
      6:  0.75
      12: 0.55

yookassa:
  shop_id: "YOUR_SHOP_ID"
  secret_key: "YOUR_SECRET_KEY"
  webhook_url: "https://yourdomain.com/webhook/yookassa"
  webhook_port: 8080

remnawave:
  url: "https://panel.example.com"        # базовый URL панели Remnawave
  token: "YOUR_REMNAWAVE_API_TOKEN"        # API-токен из раздела панели «API Tokens»
  squad_uuids:                             # UUID internal squad'ов для новых юзеров (аналог inbound-id)
    - "00000000-0000-0000-0000-000000000000"
  # ссылка, которую бот отправляет пользователю — ведёт на официальную Remnawave
  # subscription-page (браузер → HTML-страница, VPN-клиент → конфиг). Проксируется Caddy.
  sub_url_template: "https://sub.example.com/sub/%s"
